name: Build & publish mirror

on:
  workflow_dispatch:
  schedule:
    - cron: "0 4 1 * *"

permissions: {}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
    env:
      MAVEDB_LINK_MIRROR__DATA_DIR: data
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with: {python-version: "3.14"}
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with: {version: "0.8.7", enable-cache: false}
      - run: uv sync --frozen --no-dev
      - name: Build and pack without credentials
        run: |
          set -euo pipefail
          uv run mavedb-link-data build
          uv run mavedb-link-data pack
      - name: Create exact release metadata
        id: meta
        run: |
          set -euo pipefail
          uv run python - <<'PY'
          import hashlib, json, os
          from datetime import UTC, datetime
          from pathlib import Path
          from mavedb_link.ingest.release_identity import read_database_identity
          db=Path("data/mavedb.sqlite"); asset=Path("data/mavedb.sqlite.zst")
          identity=read_database_identity(db)
          # The bundle's identity is (upstream dump, mirror schema), not the dump alone: the
          # same Zenodo dump built by newer code yields a different schema. Tagging on the
          # dump date alone made those two collide, and the publish step correctly refused to
          # overwrite the published release ("published release collision").
          schema_major=identity.schema_major
          schema_version=identity.schema_version
          # r1 was the original unqualified packaging identity. r2 remains an
          # audited zero-asset orphan draft; r3 is the first collision-free
          # revision whose Git ref and build revision can be published together.
          tag=f"data-{str(identity.dump_as_of)[:10]}-s{schema_major}-r3"
          file_hash=hashlib.sha256(db.read_bytes()).hexdigest()
          tree=hashlib.sha256(f"mavedb.sqlite\0{0o444:04o}\0{db.stat().st_size}\0{file_hash}\n".encode()).hexdigest()
          payload={"tag":tag,"asset_sha256":hashlib.sha256(asset.read_bytes()).hexdigest(),
                   "asset_size":asset.stat().st_size,"expanded_tree_sha256":tree,
                   "expanded_size":db.stat().st_size,"schema_version":schema_version,
                   "build_revision":os.environ["GITHUB_SHA"],
                   "source_sha256":identity.source_sha256,"source_url":identity.source_url,
                   "retrieved_at":datetime.now(UTC).isoformat().replace("+00:00","Z"),
                   "score_set_count":identity.score_set_count,
                   "mapped_variant_count":identity.mapped_variant_count}
          Path("data/bundle-metadata.json").write_text(json.dumps(payload,sort_keys=True)+"\n")
          with Path("data/SHA256SUMS").open("w") as out:
              for path in sorted(Path("data").glob("mavedb.sqlite.zst*")):
                  out.write(f"{hashlib.sha256(path.read_bytes()).hexdigest()}  {path.name}\n")
              path=Path("data/bundle-metadata.json")
              out.write(f"{hashlib.sha256(path.read_bytes()).hexdigest()}  {path.name}\n")
          Path("tag.txt").write_text(tag)
          PY
          mkdir -p release-assets publisher
          cp data/mavedb.sqlite.zst data/mavedb.sqlite.zst.sha256 data/bundle-metadata.json \
            data/SHA256SUMS release-assets/
          cp mavedb_link/ingest/release_identity.py publisher/release_identity.py
          echo "tag=$(cat tag.txt)" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: mavedb-data-${{ steps.meta.outputs.tag }}
          path: |
            release-assets
            publisher/release_identity.py
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: data-release
    concurrency:
      group: mavedb-data-${{ needs.build.outputs.tag }}
      cancel-in-progress: false
    permissions:
      contents: write
      id-token: write
      attestations: write
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ needs.build.outputs.tag }}
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: mavedb-data-${{ needs.build.outputs.tag }}
          path: dist
      - name: Verify transferred bytes
        working-directory: dist/release-assets
        run: sha256sum --check SHA256SUMS
      - name: Inspect exact Git tag target
        id: tag_ref
        run: |
          set -euo pipefail
          response="$RUNNER_TEMP/tag-ref.response"
          set +e
          timeout 60s gh api --include "repos/$GITHUB_REPOSITORY/git/ref/tags/$TAG" >"$response"
          status=$?
          set -e
          if test "$status" -eq 0; then
            grep -Eq '^HTTP/[0-9.]+ 200 ' "$response"
            awk 'body {print} /^\r?$/{body=1}' "$response" >"$RUNNER_TEMP/tag-ref.json"
            target="$(jq -er '.object | select(.type == "commit") | .sha |
              select(type == "string" and test("^[0-9a-f]{40}$"))' \
              "$RUNNER_TEMP/tag-ref.json")"
            echo "present=true" >> "$GITHUB_OUTPUT"
            echo "target=$target" >> "$GITHUB_OUTPUT"
          elif grep -Eq '^HTTP/[0-9.]+ 404 ' "$response"; then
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "target=" >> "$GITHUB_OUTPUT"
          else
            cat "$response" >&2
            test "$status" -ne 0 || status=1
            exit "$status"
          fi
      - name: Inventory exact release identity
        id: inventory
        run: |
          set -euo pipefail
          inventory="$RUNNER_TEMP/release-inventory.jsonl"
          : >"$inventory"
          complete=false
          for page in $(seq 1 10); do
            response="$RUNNER_TEMP/release-inventory-$page.json"
            timeout 60s gh api "repos/$GITHUB_REPOSITORY/releases?per_page=100&page=$page" >"$response"
            jq -e 'type == "array" and length <= 100' "$response" >/dev/null
            count="$(jq -er 'length' "$response")"
            jq -c '.[] | {id, tag_name}' "$response" >>"$inventory"
            if test "$count" -lt 100; then
              complete=true
              break
            fi
          done
          test "$complete" = true
          state="$(python3 dist/publisher/release_identity.py inspect-inventory \
            --inventory "$inventory" --expected-tag "$TAG")"
          printf '%s\n' "$state"
          present="$(jq -er '.present | tostring' <<<"$state")"
          release_id="$(jq -er 'if .present then (.release_id | tostring) else "" end' <<<"$state")"
          if test -n "$release_id"; then grep -Eq '^[1-9][0-9]{0,18}$' <<<"$release_id"; fi
          echo "present=$present" >> "$GITHUB_OUTPUT"
          echo "release_id=$release_id" >> "$GITHUB_OUTPUT"
      - name: Inspect and verify an existing same-tag release
        id: existing
        env:
          RELEASE_ID: ${{ steps.inventory.outputs.release_id }}
          TAG_PRESENT: ${{ steps.tag_ref.outputs.present }}
          TAG_TARGET: ${{ steps.tag_ref.outputs.target }}
        run: |
          set -euo pipefail
          existing="$RUNNER_TEMP/existing-release"
          expanded="$RUNNER_TEMP/existing-mavedb.sqlite"
          response="$RUNNER_TEMP/release.response"
          mkdir -p "$existing"
          if test -n "$RELEASE_ID"; then
            grep -Eq '^[1-9][0-9]{0,18}$' <<<"$RELEASE_ID"
            timeout 60s gh api --include "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID" >"$response"
            grep -Eq '^HTTP/[0-9.]+ 200 ' "$response"
            awk 'body {print} /^\r?$/{body=1}' "$response" >"$RUNNER_TEMP/release.json"
            jq -e --argjson release_id "$RELEASE_ID" --arg tag "$TAG" \
              '.id == $release_id and .tag_name == $tag and
               (.target_commitish | type == "string" and test("^[0-9a-f]{40}$")) and
               .prerelease == false and
               ((.draft == true and .immutable == false and .published_at == null) or
                (.draft == false and .immutable == true and (.published_at | type == "string")))' \
              "$RUNNER_TEMP/release.json" >/dev/null
            jq -e '[.assets[].name] | sort == ["SHA256SUMS", "bundle-metadata.json", "mavedb.sqlite.zst", "mavedb.sqlite.zst.sha256"]' \
              "$RUNNER_TEMP/release.json" >/dev/null
            asset_ids="$(jq -cer '[.assets[].id] | select(length == 4 and (unique | length) == 4)' "$RUNNER_TEMP/release.json")"
            jq -e 'all(.[]; type == "number" and . > 0 and floor == .)' <<<"$asset_ids" >/dev/null
            for asset in mavedb.sqlite.zst mavedb.sqlite.zst.sha256 bundle-metadata.json SHA256SUMS; do
              remote_id="$(jq -er --arg asset "$asset" '.assets[] | select(.name == $asset) | .id | select(type == "number" and . > 0 and floor == .)' "$RUNNER_TEMP/release.json")"
              remote_size="$(jq -er --arg asset "$asset" '.assets[] | select(.name == $asset) | .size | select(type == "number" and . > 0 and floor == .)' "$RUNNER_TEMP/release.json")"
              remote_digest="$(jq -er --arg asset "$asset" '.assets[] | select(.name == $asset) | .digest | select(type == "string" and test("^sha256:[0-9a-f]{64}$"))' "$RUNNER_TEMP/release.json")"
              if test "$asset" = mavedb.sqlite.zst; then max_size=$((8 * 1024 * 1024 * 1024)); else max_size=$((1024 * 1024)); fi
              test "$remote_size" -le "$max_size"
              timeout 20m curl --fail --silent --show-error --location \
                --proto '=https' --proto-redir '=https' --connect-timeout 15 --max-time 1200 \
                --max-filesize "$remote_size" --header 'Accept: application/octet-stream' \
                --header "Authorization: Bearer $GH_TOKEN" \
                "https://api.github.com/repos/$GITHUB_REPOSITORY/releases/assets/$remote_id" \
                --output "$existing/$asset"
              test "$(stat -c %s "$existing/$asset")" = "$remote_size"
              test "sha256:$(sha256sum "$existing/$asset" | cut -d' ' -f1)" = "$remote_digest"
            done
            expected_build="$(jq -er .build_revision "$existing/bundle-metadata.json")"
            jq -e --arg expected "$expected_build" \
              '.target_commitish == $expected' "$RUNNER_TEMP/release.json" >/dev/null
            test "$TAG_PRESENT" = true
            test "$TAG_TARGET" = "$expected_build"
            for asset in mavedb.sqlite.zst mavedb.sqlite.zst.sha256 bundle-metadata.json SHA256SUMS; do
              timeout 2m gh attestation verify "$existing/$asset" \
                --repo "$GITHUB_REPOSITORY" \
                --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/data.yml" \
                --source-ref refs/heads/main --source-digest "$expected_build"
            done
            # The production mirror limit is 24 GiB.  The extra MiB makes a
            # decompression bomb a hard failure while preserving exact-size files.
            zstd --decompress --stdout --quiet "$existing/mavedb.sqlite.zst" \
              | dd of="$expanded" bs=1048576 count=24577 iflag=fullblock status=none
            test "$(stat -c %s "$expanded")" -le $((24 * 1024 * 1024 * 1024))
            python3 dist/publisher/release_identity.py verify-assets \
              --metadata "$existing/bundle-metadata.json" --release-dir "$existing" \
              --expanded-database "$expanded" --expected-tag "$TAG"
            echo "present=true" >> "$GITHUB_OUTPUT"
            echo "is_draft=$(jq -er '.draft | tostring' "$RUNNER_TEMP/release.json")" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "is_draft=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Resolve the exact release identity state
        id: decision
        env:
          EXISTING_PRESENT: ${{ steps.existing.outputs.present }}
          EXISTING_IS_DRAFT: ${{ steps.existing.outputs.is_draft }}
          TAG_PRESENT: ${{ steps.tag_ref.outputs.present }}
          TAG_TARGET: ${{ steps.tag_ref.outputs.target }}
        run: |
          set -euo pipefail
          args=(compare --current dist/release-assets/bundle-metadata.json)
          if test "$EXISTING_PRESENT" = true && test "$TAG_PRESENT" != true; then
            echo "release exists without its exact Git tag" >&2
            exit 1
          fi
          if test "$EXISTING_PRESENT" = true; then
            args+=(--existing "$RUNNER_TEMP/existing-release/bundle-metadata.json")
            if test "$EXISTING_IS_DRAFT" = true; then args+=(--existing-is-draft); fi
          elif test "$TAG_PRESENT" = true; then
            candidate_build="$(jq -er .build_revision dist/release-assets/bundle-metadata.json)"
            test "$TAG_TARGET" = "$candidate_build"
          fi
          set +e
          result="$(python3 dist/publisher/release_identity.py "${args[@]}" --expected-tag "$TAG")"
          status=$?
          set -e
          printf '%s\n' "$result"
          state="$(printf '%s' "$result" | jq -er .state)"
          echo "state=$state" >> "$GITHUB_OUTPUT"
          if test "$status" -ne 0; then
            echo "same-tag release collision: $(printf '%s' "$result" | jq -r .differing_field)" >&2
            exit "$status"
          fi
      - name: Create exact Git tag for a new identity
        if: >-
          steps.decision.outputs.state == 'create' &&
          steps.tag_ref.outputs.present != 'true' &&
          steps.inventory.outputs.present != 'true'
        env:
          BUILD_REVISION: ${{ github.sha }}
        run: |
          set -euo pipefail
          expected="$(jq -er .build_revision dist/release-assets/bundle-metadata.json)"
          test "$expected" = "$BUILD_REVISION"
          timeout 60s gh api --method POST "repos/$GITHUB_REPOSITORY/git/refs" \
            -f ref="refs/tags/$TAG" -f sha="$expected" \
            | jq -e --arg ref "refs/tags/$TAG" --arg expected "$expected" \
              '.ref == $ref and .object.type == "commit" and .object.sha == $expected' >/dev/null
      - name: Create an empty draft for a new identity
        id: create_release
        if: steps.decision.outputs.state == 'create'
        env:
          BUILD_REVISION: ${{ github.sha }}
        run: |
          set -euo pipefail
          response="$RUNNER_TEMP/created-release.json"
          timeout 2m gh api --method POST "repos/$GITHUB_REPOSITORY/releases" \
            -f tag_name="$TAG" -f target_commitish="$BUILD_REVISION" -f name="$TAG" \
            -f body="Immutable MaveDB CC0 reference mirror; research use only." \
            -F draft=true -F prerelease=false -F generate_release_notes=false >"$response"
          release_id="$(jq -er --arg tag "$TAG" --arg expected "$BUILD_REVISION" \
            'select(.tag_name == $tag and .target_commitish == $expected and
                    .draft == true and .immutable == false and .published_at == null and
                    .prerelease == false and (.assets | type == "array" and length == 0)) |
             .id | select(type == "number" and . > 0 and . <= 9999999999999999999 and floor == .)' \
            "$response")"
          echo "release_id=$release_id" >> "$GITHUB_OUTPUT"
      - name: Verify newly created exact Git tag target
        if: steps.decision.outputs.state == 'create'
        run: |
          set -euo pipefail
          expected="$(jq -er .build_revision dist/release-assets/bundle-metadata.json)"
          timeout 60s gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$TAG" \
            | jq -e --arg expected "$expected" \
              '.object.type == "commit" and .object.sha == $expected' >/dev/null
      - name: Upload new sealed assets
        if: steps.decision.outputs.state == 'create'
        env:
          RELEASE_ID: ${{ steps.create_release.outputs.release_id }}
        run: |
          set -euo pipefail
          grep -Eq '^[1-9][0-9]{0,18}$' <<<"$RELEASE_ID"
          upload_url="https://uploads.github.com/repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID/assets"
          python3 dist/publisher/release_identity.py validate-upload-url --url "$upload_url" >/dev/null
          for asset in mavedb.sqlite.zst mavedb.sqlite.zst.sha256 bundle-metadata.json SHA256SUMS; do
            path="dist/release-assets/$asset"
            response="$RUNNER_TEMP/upload-$asset.json"
            size="$(stat -c %s "$path")"
            digest="sha256:$(sha256sum "$path" | cut -d' ' -f1)"
            timeout 10m curl --fail --silent --show-error \
              --proto '=https' --connect-timeout 15 --max-time 600 \
              --request POST --header 'Accept: application/vnd.github+json' \
              --header "Authorization: Bearer $GH_TOKEN" \
              --header 'Content-Type: application/octet-stream' \
              --data-binary "@$path" \
              "$upload_url?name=$asset" \
              --output "$response"
            jq -e --arg asset "$asset" --arg digest "$digest" --argjson size "$size" \
              '.id | select(type == "number" and . > 0 and floor == .)' "$response" >/dev/null
            jq -e --arg asset "$asset" --arg digest "$digest" --argjson size "$size" \
              '.name == $asset and .size == $size and .digest == $digest' "$response" >/dev/null
          done
      - name: Attest new release assets
        if: steps.decision.outputs.state == 'create'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: "dist/release-assets/*"
      - name: Promote a freshly verified exact draft
        if: steps.decision.outputs.state == 'draft_publish_existing' || steps.decision.outputs.state == 'create'
        env:
          CREATED_RELEASE_ID: ${{ steps.create_release.outputs.release_id }}
          EXISTING_RELEASE_ID: ${{ steps.inventory.outputs.release_id }}
        run: |
          set -euo pipefail
          existing="$RUNNER_TEMP/promotion-release"
          expanded="$RUNNER_TEMP/promotion-mavedb.sqlite"
          response="$RUNNER_TEMP/promotion-release.json"
          post_response="$RUNNER_TEMP/promoted-release.json"
          mkdir -p "$existing"
          release_id="${CREATED_RELEASE_ID:-$EXISTING_RELEASE_ID}"
          grep -Eq '^[1-9][0-9]{0,18}$' <<<"$release_id"
          timeout 60s gh api "repos/$GITHUB_REPOSITORY/releases/$release_id" >"$response"
          jq -e --argjson release_id "$release_id" --arg tag "$TAG" \
            '.id == $release_id and .tag_name == $tag and
             (.target_commitish | type == "string" and test("^[0-9a-f]{40}$")) and
             .draft == true and .immutable == false and .published_at == null and
             .prerelease == false and
             ([.assets[].name] | sort == ["SHA256SUMS", "bundle-metadata.json", "mavedb.sqlite.zst", "mavedb.sqlite.zst.sha256"])' \
            "$response" >/dev/null
          jq -c '[.assets[] | {id, name, size, digest}] | sort_by(.name)' \
            "$response" >"$RUNNER_TEMP/pre-promotion-assets.json"
          asset_ids="$(jq -cer '[.assets[].id] | select(length == 4 and (unique | length) == 4)' "$response")"
          jq -e 'all(.[]; type == "number" and . > 0 and floor == .)' <<<"$asset_ids" >/dev/null
          for asset in mavedb.sqlite.zst mavedb.sqlite.zst.sha256 bundle-metadata.json SHA256SUMS; do
            remote_id="$(jq -er --arg asset "$asset" '.assets[] | select(.name == $asset) | .id | select(type == "number" and . > 0 and floor == .)' "$response")"
            remote_size="$(jq -er --arg asset "$asset" '.assets[] | select(.name == $asset) | .size' "$response")"
            remote_digest="$(jq -er --arg asset "$asset" '.assets[] | select(.name == $asset) | .digest' "$response")"
            jq -en --argjson size "$remote_size" '$size | select(type == "number" and . > 0 and floor == .)' >/dev/null
            grep -Eq '^sha256:[0-9a-f]{64}$' <<<"$remote_digest"
            if test "$asset" = mavedb.sqlite.zst; then max_size=$((8 * 1024 * 1024 * 1024)); else max_size=$((1024 * 1024)); fi
            test "$remote_size" -le "$max_size"
            timeout 20m curl --fail --silent --show-error --location \
              --proto '=https' --proto-redir '=https' --connect-timeout 15 --max-time 1200 \
              --max-filesize "$remote_size" --header 'Accept: application/octet-stream' \
              --header "Authorization: Bearer $GH_TOKEN" \
              "https://api.github.com/repos/$GITHUB_REPOSITORY/releases/assets/$remote_id" \
              --output "$existing/$asset"
            test "$(stat -c %s "$existing/$asset")" = "$remote_size"
            test "sha256:$(sha256sum "$existing/$asset" | cut -d' ' -f1)" = "$remote_digest"
          done
          expected_build="$(jq -er .build_revision "$existing/bundle-metadata.json")"
          jq -e --arg expected "$expected_build" \
            '.target_commitish == $expected' "$response" >/dev/null
          for asset in mavedb.sqlite.zst mavedb.sqlite.zst.sha256 bundle-metadata.json SHA256SUMS; do
            timeout 2m gh attestation verify "$existing/$asset" \
              --repo "$GITHUB_REPOSITORY" \
              --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/data.yml" \
              --source-ref refs/heads/main --source-digest "$expected_build"
          done
          sha256sum --check "$existing/SHA256SUMS"
          zstd --decompress --stdout --quiet "$existing/mavedb.sqlite.zst" \
            | dd of="$expanded" bs=1048576 count=24577 iflag=fullblock status=none
          test "$(stat -c %s "$expanded")" -le $((24 * 1024 * 1024 * 1024))
          python3 dist/publisher/release_identity.py verify-assets \
            --metadata "$existing/bundle-metadata.json" --release-dir "$existing" \
            --expanded-database "$expanded" --expected-tag "$TAG"
          python3 dist/publisher/release_identity.py compare \
            --current dist/release-assets/bundle-metadata.json \
            --existing "$existing/bundle-metadata.json" --existing-is-draft \
            --expected-tag "$TAG" \
            | jq -e '.state == "draft_publish_existing"' >/dev/null
          expected="$(jq -er .build_revision "$existing/bundle-metadata.json")"
          timeout 60s gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$TAG" \
            | jq -e --arg expected "$expected" \
              '.object.type == "commit" and .object.sha == $expected' >/dev/null
          timeout 2m gh api --method PATCH "repos/$GITHUB_REPOSITORY/releases/$release_id" \
            -F draft=false >"$post_response"
          timeout 60s gh api "repos/$GITHUB_REPOSITORY/releases/$release_id" >"$post_response"
          jq -e --argjson release_id "$release_id" --arg tag "$TAG" --arg expected "$expected" \
            '.id == $release_id and .tag_name == $tag and .target_commitish == $expected and
             .draft == false and .immutable == true and .prerelease == false and
             (.published_at | type == "string")' "$post_response" >/dev/null
          jq -c '[.assets[] | {id, name, size, digest}] | sort_by(.name)' \
            "$post_response" >"$RUNNER_TEMP/post-promotion-assets.json"
          cmp "$RUNNER_TEMP/pre-promotion-assets.json" "$RUNNER_TEMP/post-promotion-assets.json"
